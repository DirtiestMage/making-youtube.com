<!DOCTYPE html>
<html>

<head>
  <title> Youtube </title>
  <link rel="stylesheet" href="youtube.css">
</head>

<body>

  <div class="top-div">
    <input class="search" type="text" placeholder="Search">
  </div>



<div class="video-div">

  <!-- Thumbnail clickable -->
  <a href="https://www.youtube.com/watch?v=n2RNcPRtAiY"
     target="_blank"
     rel="noopener noreferrer">
    <img class="thumbnail" src="./thumbnails/thumbnail-1.webp">
  </a>

  <div class="video-info">

    <!-- Channel image clickable -->
    <div class="channel">
      <a href="https://www.youtube.com/c/mkbhd"
         target="_blank"
         rel="noopener noreferrer">
        <img class="channel-image" src="channels/channel-1.jpeg">
      </a>
    </div>

    <div class="video-text">

      <!-- Title clickable -->
      <a href="https://www.youtube.com/watch?v=mP0RAo9SKZk"
         target="_blank"
         rel="noopener noreferrer">
        <p class="video-title">
          Talking Tech and AI with Google CEO Sundar Pichai!
        </p>
      </a>

      <!-- Channel name clickable -->
      <a href="https://www.youtube.com/c/mkbhd"
         target="_blank"
         rel="noopener noreferrer">
        <p class="video-author">
          Marques Brownlee ✓
        </p>
      </a>

      <p class="video-stats">
        3.4M views · 6 months ago
      </p>

    </div>
  </div>

</div>
<div class="video-div">

  <!-- Thumbnail clickable -->
  <a href="https://www.youtube.com/watch?v=mP0RAo9SKZk" 
     target="_blank" 
     rel="noopener noreferrer">
    <img class="thumbnail" src="./thumbnails/thumbnail-2.webp" alt="Talking Tech and AI with Google CEO Sundar Pichai thumbnail">
  </a>

  <div class="video-info">

    <!-- Channel image clickable -->
    <div class="channel">
      <a href="https://www.youtube.com/c/markiplier" 
         target="_blank" 
         rel="noopener noreferrer">
        <img class="channel-image" src="channels/channel-2.jpeg" alt="Marques Brownlee channel profile">
      </a>
    </div>

    <div class="video-text">

      <!-- Title clickable -->
      <a href="https://www.youtube.com/watch?v=mP0RAo9SKZk" 
         target="_blank" 
         rel="noopener noreferrer">
        <p class="video-title">
          Try Not To Laugh Challenge #9
        </p>
      </a>

      <!-- Channel name clickable -->
      <a href="https://www.youtube.com/c/markiplier" 
         target="_blank" 
         rel="noopener noreferrer">
        <p class="video-author">
          Markiplier ✓
        </p>
      </a>

      <p class="video-stats">
        19M views · 4 years ago
      </p>

    </div>
  </div>

</div>

</body>

</html>
